<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slides</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0f;
      --fg: #f2f2f5;
      --muted: #9a9aa5;
      --card: #17171d;
      --border: #2a2a33;
      --accent: #6ea8fe;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 640px;
      padding: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 1.5rem;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    a.deck {
      display: block;
      padding: 1rem 1.25rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--fg);
      text-decoration: none;
      transition: border-color 0.15s ease;
    }
    a.deck:hover {
      border-color: var(--accent);
    }
    a.deck .title {
      font-weight: 600;
    }
    a.deck .lang {
      color: var(--muted);
      font-size: 0.85rem;
      margin-left: 0.5rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Slides</h1>
    <ul>
      <li>
        <a class="deck" href="./chatbot-to-teammate/">
          <span class="title">От чатбота до тиммейта</span>
          <span class="lang">RU</span>
        </a>
      </li>
      <li>
        <a class="deck" href="./whats-a-harness/">
          <span class="title">Что такое агенты и как их есть</span>
          <span class="lang">RU</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>

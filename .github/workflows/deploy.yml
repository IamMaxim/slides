name: Deploy slides to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        deck: [chatbot-to-teammate, whats-a-harness]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.deck }}/package-lock.json
      - name: Install
        working-directory: ${{ matrix.deck }}
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: ${{ matrix.deck }}
        run: npm run build -- --base=/slides/${{ matrix.deck }}/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.deck }}
          path: ${{ matrix.deck }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-chatbot-to-teammate
          path: site/chatbot-to-teammate
      - uses: actions/download-artifact@v4
        with:
          name: dist-whats-a-harness
          path: site/whats-a-harness
      - name: Add landing page
        run: cp docs/pages-index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
